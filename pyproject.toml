[project]
name = "nexaegis-ai"
version = "0.2.0"
description = "Local-first, risk-aware AI DevOps terminal for developers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "MOPARA PAIR AYAT" }]
keywords = ["devops", "security", "cli", "ai", "risk"]
dependencies = [
  "gitpython>=3.1.43",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.1",
  "rich>=13.7.1",
  "textual>=0.79.1",
  "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/nexaegis/nexaegis-ai"
Issues = "https://github.com/nexaegis/nexaegis-ai/issues"

[project.scripts]
nax = "nexaegis.cli.app:main"

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexaegis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
